<style>
/*FONTS*/
:root{--bg:#000;--fg:#F2F2F0;--muted:#8C8C90;--line:#2A2A2D;--card:#0D0D0E;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}


.hero{position:relative;height:clamp(300px,48svh,560px);overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 45%,#000 98%)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.head{text-align:center;margin:-.55em 0 28px;position:relative;z-index:2}
h1{margin:0;font-weight:900;font-stretch:125%;font-size:clamp(34px,10.5vw,56px);letter-spacing:-.02em;line-height:.85;text-transform:uppercase}

.list{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(13,13,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none;transition:transform .18s cubic-bezier(.3,.7,.4,1),border-color .18s,background .18s}
.btn:hover{transform:scale(1.02);border-color:#555}
.btn:active{transform:scale(.99)}
.btn .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--fg)}
.btn .ic svg{width:22px;height:22px}
.btn .tx{flex:1;min-width:0}
.btn strong{display:block;font-weight:700;font-stretch:110%;font-size:16px;letter-spacing:.01em}
.btn small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.btn .ar{color:var(--muted);flex:none;font-size:18px;transition:transform .18s}
.btn:hover .ar{transform:translateX(3px);color:var(--fg)}

/* featured: newest song */
.btn.feat{background:var(--fg);color:#000;border-color:var(--fg);min-height:76px}
.btn.feat .ic{color:#000}
.btn.feat small{color:#555}
.btn.feat .ar{color:#000}
.badge{display:inline-block;margin-right:8px;padding:2px 7px 3px;border-radius:5px;background:#000;color:var(--fg);font-size:10px;font-weight:700;font-stretch:112%;letter-spacing:.14em;vertical-align:2px}

.sec{margin:26px 0 12px;font-weight:500;font-stretch:112%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}
.social{display:flex;justify-content:center;gap:12px;margin-top:30px}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(13,13,14,.82);transition:transform .18s,border-color .18s}
.social a:hover{transform:scale(1.08);border-color:#555}
.social svg{width:20px;height:20px}
.foot{margin-top:34px;display:flex;justify-content:center;gap:18px;font-size:11.5px;color:var(--muted)}
.foot a{text-decoration:none;color:var(--muted)}
.foot a:hover{color:var(--fg)}

@media (prefers-reduced-motion:no-preference){
  .head,.list > *,.sec,.social{opacity:0;transform:translateY(10px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
  .list > *:nth-child(1){animation-delay:.08s}.list > *:nth-child(2){animation-delay:.14s}.list > *:nth-child(3){animation-delay:.2s}
  .list > *:nth-child(4){animation-delay:.26s}.list > *:nth-child(5){animation-delay:.32s}
  .sec,.social{animation-delay:.44s}
  @keyframes in{to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.btn,.btn .ar,.social a{transition:none}}
</style>
</head>
