<style>
/*FONTS*/
:root{--bg:#000;--fg:#F2F2F0;--muted:#8C8C90;--line:#2A2A2D;--card:#0D0D0E;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased;min-height:100svh}
a{color:inherit}
a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}


.hero{position:relative;height:clamp(300px,48svh,560px);overflow:hidden}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 45%,#000 98%)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom,0px))}
.head{text-align:center;margin:clamp(-84px,-14vw,-52px) 0 18px;position:relative;z-index:2}
h1{margin:0;font-weight:900;font-stretch:125%;font-size:clamp(34px,10.5vw,56px);letter-spacing:-.02em;line-height:.85;text-transform:uppercase}

.list{display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;min-height:62px;padding:12px 18px;border:1px solid var(--line);border-radius:14px;background:rgba(13,13,14,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-decoration:none;transition:transform .18s cubic-bezier(.3,.7,.4,1),border-color .18s,background .18s}
.btn:hover{transform:scale(1.02);border-color:#555}
.btn:active{transform:scale(.99)}
.btn .ic{width:22px;height:22px;flex:none;display:grid;place-items:center;color:var(--fg)}
.btn .ic svg{width:22px;height:22px}
.btn .tx{flex:1;min-width:0}
.btn strong{display:block;font-weight:700;font-stretch:110%;font-size:16px;letter-spacing:.01em}
.btn small{display:block;margin-top:2px;color:var(--muted);font-size:13px}
.btn .ar{color:var(--muted);flex:none;font-size:18px;transition:transform .18s}
.btn:hover .ar{transform:translateX(3px);color:var(--fg)}

/* featured: newest song */
.btn.feat{background:var(--fg);color:#000;border-color:var(--fg);min-height:76px}
.btn.feat .ic{color:#000}
.btn.feat small{color:#555}
.btn.feat .ar{color:#000}
/* featured: light travelling around the edge + soft breathing glow + bobbing note */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.btn.feat{position:relative;isolation:isolate}
.btn.feat::before{content:"";position:absolute;inset:-4px;border-radius:18px;padding:2px;background:conic-gradient(from var(--a),transparent 0 62%,rgba(255,255,255,.15) 72%,#fff 86%,transparent 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);z-index:-1;pointer-events:none;opacity:0}
.btn.feat::after{content:"";position:absolute;inset:0;border-radius:14px;z-index:-2;pointer-events:none}
@media (prefers-reduced-motion:no-preference){
  .btn.feat::before{opacity:1;animation:av-orbit 3.6s linear infinite}
  .btn.feat::after{animation:av-breathe 3.6s ease-in-out infinite}
  .btn.feat .ic svg{animation:av-bob 1.8s ease-in-out infinite;transform-origin:50% 80%}
}
@keyframes av-orbit{to{--a:360deg}}
@keyframes av-breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 26px 2px rgba(255,255,255,.22)}}
@keyframes av-bob{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-2px) rotate(-8deg)}60%{transform:translateY(0) rotate(4deg)}}
.badge{display:inline-block;margin-right:8px;padding:2px 7px 3px;border-radius:5px;background:#000;color:var(--fg);font-size:10px;font-weight:700;font-stretch:112%;letter-spacing:.14em;vertical-align:2px}

.sec{margin:26px 0 12px;font-weight:500;font-stretch:112%;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:center}
.stream{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.stream a{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:rgba(13,13,14,.82);text-decoration:none;font-weight:600;font-stretch:110%;font-size:13px;transition:transform .18s,border-color .18s}
.stream a::after{content:"↗";color:var(--muted);font-size:12px}
.stream a:hover{transform:scale(1.04);border-color:#555}
.icons{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;margin:0 0 22px}
.icons a{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(13,13,14,.82);color:var(--fg);text-decoration:none;transition:transform .18s,border-color .18s}
.icons a:hover{transform:scale(1.1);border-color:#555}
.icons svg{width:15px;height:15px}
.icons .ic-txt{font-weight:800;font-stretch:112%;font-size:15px;line-height:1;margin-top:-2px}
.icons .ic-sep{width:1px;height:18px;background:var(--line);margin:0 2px}
.social{display:flex;justify-content:center;gap:12px;margin-top:26px}
.social a{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:rgba(13,13,14,.82);transition:transform .18s,border-color .18s}
.social a:hover{transform:scale(1.08);border-color:#555}
.social svg{width:20px;height:20px}
.foot{margin-top:34px;display:flex;justify-content:center;gap:18px;font-size:11.5px;color:var(--muted)}
.foot a{text-decoration:none;color:var(--muted)}
.foot a:hover{color:var(--fg)}

@media (prefers-reduced-motion:no-preference){
  .head,.icons,.list > *,.sec,.stream,.social{opacity:0;transform:translateY(10px);animation:in .6s cubic-bezier(.2,.7,.2,1) forwards}
  .icons{animation-delay:.05s}.list > *:nth-child(1){animation-delay:.1s}.list > *:nth-child(2){animation-delay:.14s}.list > *:nth-child(3){animation-delay:.2s}
  .list > *:nth-child(4){animation-delay:.26s}.list > *:nth-child(5){animation-delay:.32s}
  .sec,.stream,.social{animation-delay:.44s}
  @keyframes in{to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){.btn,.btn .ar,.social a{transition:none}}
</style>
